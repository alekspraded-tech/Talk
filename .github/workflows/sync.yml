name: Talk to Supabase Sync

on:
  schedule:
   # Запуск в 14:45 UTC (что соответствует 17:45 по МСК) каждый день с понедельника по пятницу
    - cron: '45 14 * * 1-5'
  workflow_dispatch: # Позволит запускать вручную кнопку в интерфейсе

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        pip install requests supabase

    - name: Запуск скрипта синхронизации
      run: python sync_script.py
