<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Записи встреч Контур.Толк</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e1e4e6;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 24px;
            margin: 0;
        }
        .btn-refresh {
            background-color: #5346e0;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-refresh:hover {
            background-color: #4135c4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e1e4e6;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 10px 0;
            color: #111;
        }
        .card-meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .btn-view {
            display: inline-block;
            text-align: center;
            background-color: #f0f0f5;
            color: #5346e0;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-view:hover {
            background-color: #5346e0;
            color: white;
        }
        .status-message {
            text-align: center;
            color: #666;
            padding: 40px;
            background: white;
            border-radius: 8px;
            border: 1px dashed #cbd2d6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>Записи встреч Контур.Толк</h1>
            <div style="font-size: 13px; color: #666; margin-top: 5px;">Синхронизация с базой данных</div>
        </div>
        <button class="btn-refresh" onclick="fetchRecords()">🔄 Обновить список</button>
    </div>

    <div id="content-area">
        <div class="status-message">Загрузка данных из Supabase...</div>
    </div>
</div>

<script>
    // Инициализируем подключение к вашей базе данных Supabase
    const SUPABASE_URL = "https://jqtznmrwxswbveugfsbv.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdHpubXJ3eHN3YnZldWdmc2J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTc2ODUzMDksImV4cCI6MjAzMzI2MTMwOX0.48_bV6eN8wBvYwR74k1pTclX-vM9n9ZJ74M2X_9bV6M"; // Публичный anon-ключ для чтения

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchRecords() {
        const contentArea = document.getElementById("content-area");
        contentArea.innerHTML = '<div class="status-message">Обновление списка...</div>';

        try {
            // Читаем данные из таблицы talk_records, сортируя новые встречи вверх
            const { data, error } = await supabaseClient
                .from('talk_records')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!data || data.length === 0) {
                contentArea.innerHTML = `
                    <div class="status-message">
                        В базе данных пока нет сохраненных записей менеджеров. Ожидайте автоматической синхронизации.
                    </div>`;
                return;
            }

            // Формируем сетку карточек
            let gridHtml = '<div class="grid">';
            data.forEach(record => {
                // Красиво форматируем дату встречи
                const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                const formattedDate = record.created_at 
                    ? new Date(record.created_at).toLocaleDateString('ru-RU', dateOptions) 
                    : 'Дата не указана';

                gridHtml += `
                    <div class="card">
                        <div>
                            <div class="card-title">${escapeHtml(record.name)}</div>
                            <div class="card-meta">
                                📅 <b>Дата:</b> ${formattedDate}<br>
                                👤 <b>Менеджер:</b> ${escapeHtml(record.manager_email)}
                            </div>
                        </div>
                        <a href="${record.view_url}" target="_blank" class="btn-view">👀 Смотреть запись</a>
                    </div>`;
            });
            gridHtml += '</div>';

            contentArea.innerHTML = gridHtml;

        } catch (err) {
            console.error(err);
            contentArea.innerHTML = `<div class="status-message" style="color: red; border-color: red;">⚠️ Ошибка загрузки данных: ${err.message}</div>`;
        }
    }

    // Вспомогательная функция защиты от XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Первоначальный вызов при загрузке страницы
    fetchRecords();
</script>

</body>
</html>
